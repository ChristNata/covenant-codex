[package]
name = "codex-covenant-login-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
autotests = false

[workspace]
resolver = "2"

[dev-dependencies]
anyhow = "=1.0.103"
codex-login = { path = "../../codex-rs/login" }
codex-protocol = { path = "../../codex-rs/protocol" }
keyring = { version = "=3.6.3", default-features = false }
pretty_assertions = "=1.4.1"
rand = "=0.9.3"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["fmt"] }

[[test]]
name = "covenant_auth"
path = "../../codex-rs/login/tests/covenant_auth.rs"

[profile.dev]
debug = "limited"

# Preserve the adopted workspace's exact source patches for reachable crates.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
